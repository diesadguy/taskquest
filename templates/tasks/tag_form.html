{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">Создание тега</h1>

<p>
    Проект:
    <a href="{% url 'project_detail' project.id %}">
        {{ project.title }}
    </a>
</p>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">{{ form.name.label }}</label>
        {{ form.name }}
        {{ form.name.errors }}
    </div>

    <div class="mb-3">
        <label class="form-label">{{ form.color.label }}</label>
        {{ form.color }}
        {{ form.color.errors }}
    </div>

    <button type="submit" class="btn btn-primary">
        Создать тег
    </button>

    <a href="{% url 'project_detail' project.id %}" class="btn btn-secondary">
        Отмена
    </a>
</form>
{% endblock %}
