{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    Уведомления
</h2>

{% for notification in notifications %}

<div class="card mb-3 border-0 shadow-sm">

    <div class="card-body">

        <h5>
            {{ notification.title }}
        </h5>

        <p>
            {{ notification.text }}
        </p>

        <small class="text-muted">
            {{ notification.created_at }}
        </small>

    </div>

</div>

{% empty %}

<div class="alert alert-info">
    Уведомлений нет.
</div>

{% endfor %}

{% endblock %}
